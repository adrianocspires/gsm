      <stop offset="1" stop-color="#0d6e64"/>
    </linearGradient>
    <linearGradient id="si-shield" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#18a697"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="si-shadow-lg" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0f766e" flood-opacity="0.18"/>
