<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" aria-hidden="true">
  <defs>
    <radialGradient id="si-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 200) rotate(90) scale(140)">
      <stop stop-color="#139184" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#139184" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="si-card" x1="120" y1="100" x2="280" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0faf8"/>
    </linearGradient>
    <linearGradient id="si-btn" x1="0" y1="0" x2="1" y2="1">
